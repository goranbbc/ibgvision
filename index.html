<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBG VISION | Corporate Visuals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f2f1ef;
            --text-dark: #1a1a1a;
            --accent-border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 20px;
        }

        /* Glavni kontejner */
        .main-card {
            background: white;
            border-radius: 40px;
            overflow: hidden;
            max-width: 1400px;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        /* Navigacija */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo span { 
            font-weight: 300; 
            margin-left: 5px; 
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-proposal {
            border: 1px solid #ccc;
            padding: 10px 20px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 13px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-proposal:hover {
            background: var(--text-dark);
            color: white;
            border-color: var(--text-dark);
        }

        /* Hero */
        .hero {
            position: relative;
            margin: 0 20px;
            height: 600px;
            border-radius: 5px;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        .hero-overlay {
            position: absolute;
            bottom: 60px;
            left: 50px;
            color: white;
            max-width: 800px;
        }

        .hero-overlay h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .hero-overlay p {
            font-size: 22px;
            font-weight: 300;
            opacity: 0.9;
        }

        /* IMAGO link */
        .branding-footer {
            padding: 40px 50px;
            display: flex;
            justify-content: flex-end;
            text-align: right;
        }

        .imago-logo {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .imago-logo h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
        }

        .imago-logo p {
            font-size: 18px;
            font-weight: 300;
            color: #666;
            margin-top: 5px;
        }

        .imago-logo:hover {
            transform: translateY(-3px);
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            nav, .btn-proposal { display: none; }
            .hero-overlay h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header>
            <div class="logo">IBG<span>VISION</span></div>

            <nav>
                <ul>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Visual Documentation</a></li>
                    <li><a href="#">Portfolio</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

            <a href="#" class="btn-proposal">Request Proposal</a>
        </header>

        <section class="hero">
            <img src="TVOJA_SLIKA.jpg" alt="Business Meeting">
            <div class="hero-overlay">
                <h1>VISUAL INTELLIGENCE FOR BUSINESS |</h1>
                <p>Corporate Portraits, Dynamic Operations & Precise Reporting</p>
            </div>
        </section>

        <section class="branding-footer">
            <a href="https://www.imagobygorus.com" target="_blank" class="imago-logo">
                <h2>IMAGO BY GORUS</h2>
                <p>Fine Art & Personal Work</p>
            </a>
        </section>
    </div>

</body>
</html>
